directories:
  output: dist
  buildResources: build
appId: com.suaempresa.painelfinancas
productName: Painel de Finanças
files:
  - filter:
      - main.js
      - preload.js
      - renderer/**/*
      - data/**/*
      - node_modules/**/*
      - package.json
win:
  target: nsis
  icon: renderer/assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
electronVersion: 31.7.7
